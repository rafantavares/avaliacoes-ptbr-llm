# Roda os testes a cada push e pull request. Não precisam dos dados da Olist
# nem de GPU: usam pequenos conjuntos sintéticos.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
